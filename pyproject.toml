[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "residual-mlp-baseline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "jupytext>=1.19.6",
    "marimo>=0.25.1,<1",
    "torch>=2.0",
]   # lower bound only, so pip keeps your existing CUDA build

[dependency-groups]
dev = [
    "datasets>=4,<5",
    "matplotlib>=3.9,<4",
    "numpy>=2,<3",
    "pillow>=11,<13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.marimo.runtime]
auto_reload = "autorun"
watcher_on_save = "autorun"
